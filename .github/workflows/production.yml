name: Production Build

on:
  push:
    branches:
      - production

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"
  APP_FILE: "app.py"
  APP_NAME: "Hello World Project"
  IMAGE_NAME: "merur1/hello-world-image"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Automatically create the next version tag
      - name: Bump Version
        id: version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: production
          tag_prefix: v

      # Display the generated version
      - name: Display Version
        run: echo "New Version = ${{ steps.version.outputs.new_tag }}"

      # Check Docker installation
      - name: Check Docker
        run: docker --version

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Display project name
      - name: Display Project Name
        run: echo "Building ${{ env.APP_NAME }}"

      # Run Python application
      - name: Run Application
        run: python ${{ env.APP_FILE }}

      # Build Docker image
      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.new_tag }} \
            -t ${{ env.IMAGE_NAME }}:latest \
            .

      # Display Docker images
      - name: Show Docker Images
        run: docker images

      # Push versioned image
      - name: Push Version Image
        run: docker push ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.new_tag }}

      # Push latest image
      - name: Push Latest Image
        run: docker push ${{ env.IMAGE_NAME }}:latest

      # Display success message
      - name: Success
        run: |
          echo "======================================="
          echo "Docker Image Successfully Published!"
          echo "Project  : ${{ env.APP_NAME }}"
          echo "Repository : ${{ env.IMAGE_NAME }}"
          echo "Version : ${{ steps.version.outputs.new_tag }}"
          echo "======================================="
