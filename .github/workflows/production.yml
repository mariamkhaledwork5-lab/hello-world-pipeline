name: Production Build

on:
  push:
    branches:
      - production

env:
  PYTHON_VERSION: "3.12"
  APP_FILE: "app.py"
  APP_NAME: "Hello World Project"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Check that Docker is installed
      - name: Check Docker
        run: docker --version

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Display Project Name
        run: echo "Building ${{ env.APP_NAME }}"

      - name: Run Application
        run: python ${{ env.APP_FILE }}

      # Step 3: Build the Docker image
      - name: Build Docker Image
        run: docker build -t hello-world-image .

      # Show the images that exist after the build
      - name: Show Docker Images
        run: docker images
